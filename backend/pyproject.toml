[project]
name = "peblo-tv-api"
version = "0.1.0"
description = "Peblo TV Mini — CMS API, catalogue publisher and viewer catalogue feed."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "pillow>=11.0",
    "boto3>=1.35",
    "orjson>=3.10",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "boto3-stubs[s3]>=1.35",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "PTH"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom.
# "600×900" is what an editor reads on the upload slot; the multiplication sign is deliberate.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
# Tests touch the filesystem directly inside async cases; blocking there is fine.
"tests/*" = ["S101", "ASYNC230", "ASYNC240"]

# ----------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No -q: the run must always print "N passed / N skipped" so a skipped
# integration module cannot hide behind a green gate.
addopts = "--strict-markers -ra"
markers = [
    "integration: needs a reachable PostgreSQL (docker compose up db)",
]
